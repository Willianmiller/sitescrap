name: Scrape RJ Leilões

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Scrape RJ Leilões
        run: node scraper/rjleiloes-scraper.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/rjleiloes-data.json
          git diff --staged --quiet || git commit -m "Update rjleiloes data $(date +\%Y-\%m-\%d)"
          git push
