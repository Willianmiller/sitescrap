name: Scrape Leilões RJ (multi-fonte)

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Build dados multi-fonte (Spy + Mega)
        run: node scraper/build.js
        env:
          MAX_IMAGES: '12'
          MAX_PAGES: '150'

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/rjleiloes-data.json
          git diff --staged --quiet || git commit -m "Update leiloes data $(date +\%Y-\%m-\%d)"
          git push
