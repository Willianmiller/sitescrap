<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Cleber Lima Advocacia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
:root{--bg:#0B0B0B;--surface:#171717;--surface2:#1e1e1e;--border:#2a2a2a;--accent:#B38547;--accentHover:#c99a5a;--text:#e8e8e8;--muted:#888;--danger:#c0392b;--success:#27ae60;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;min-height:100vh}
.panel{max-width:1400px;margin:0 auto;padding:120px 20px 60px}
.panel-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:32px}
.panel-header h1{font-size:1.8rem;font-weight:700;color:var(--text)}
.panel-header h1 span{color:var(--accent)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;min-width:140px}
.stat-card .label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat-card .value{font-size:1.6rem;font-weight:700;color:var(--text);margin-top:4px}
.stat-card .value.accent{color:var(--accent)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;color:var(--text);font-family:inherit;font-size:.9rem;outline:none;transition:border .2s}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
.toolbar input[type="text"]{min-width:260px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:var(--radius);font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-accent{background:var(--accent);color:#000}.btn-accent:hover{background:var(--accentHover)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#e74c3c}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#2ecc71}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:1100px}
thead{background:var(--surface2)}
th{text-align:left;padding:12px 14px;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:.85rem}
tr:hover{background:var(--surface2)}
tr.hidden-row{opacity:.4}
.cell-img{width:60px}
.cell-img img{width:56px;height:40px;object-fit:cover;border-radius:6px;background:#222}
.cell-img .no-img{width:56px;height:40px;border-radius:6px;background:#222;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.65rem}
.cell-title{max-width:240px}
.cell-title a{color:var(--text);text-decoration:none;font-weight:500}
.cell-title a:hover{color:var(--accent)}
.cell-price{white-space:nowrap;font-weight:600;color:var(--accent)}
.cell-cidade{white-space:nowrap}
.cell-tipo{display:inline-block;padding:3px 8px;border-radius:20px;font-size:.7rem;font-weight:600;background:var(--surface2);border:1px solid var(--border);white-space:nowrap}
.cell-tipo.judicial{border-color:var(--accent);color:var(--accent)}
.cell-tipo.extrajudicial{border-color:#3498db;color:#3498db}
.cell-tipo.proposta{border-color:#9b59b6;color:#9b59b6}
.cell-actions{display:flex;gap:6px;white-space:nowrap}
.cell-actions button{background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:6px;color:var(--muted);font-size:.75rem;transition:all .15s}
.cell-actions button:hover{color:var(--text);background:var(--surface2)}
.cell-actions button.icon-hide:hover{color:var(--danger)}
.cell-actions button.icon-edit:hover{color:var(--accent)}
.cell-actions button.icon-link:hover{color:var(--success)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:28px}
.modal h2{font-size:1.1rem;font-weight:700;margin-bottom:20px}
.modal label{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.modal input,.modal textarea,.modal select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:.85rem;margin-bottom:14px;outline:none}
.modal textarea{resize:vertical;min-height:80px}
.modal input:focus,.modal textarea:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--success);color:#fff;padding:12px 20px;border-radius:var(--radius);font-size:.85rem;font-weight:600;z-index:99999;transform:translateY(80px);opacity:0;transition:all .3s ease}
.toast.show{transform:translateY(0);opacity:1}
/* Login */
#loginGate{position:fixed;inset:0;background:var(--bg);z-index:100000;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px 32px;width:100%;max-width:360px;text-align:center}
.login-box img{height:64px;width:auto;margin-bottom:18px}
.login-box h2{font-size:1.2rem;font-weight:700;margin-bottom:6px}
.login-box p{font-size:.8rem;color:var(--muted);margin-bottom:20px}
.login-box input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-family:inherit;font-size:.9rem;text-align:center;outline:none;margin-bottom:14px}
.login-box input:focus{border-color:var(--accent)}
.login-box button{width:100%;background:var(--accent);color:#000;border:none;border-radius:8px;padding:12px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;transition:background .2s}
.login-box button:hover{background:var(--accentHover)}
.login-error{display:none;color:var(--danger);font-size:.8rem;margin-top:12px}
.pagination{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.pagination button{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text);cursor:pointer;font-size:.8rem;transition:all .15s}
.pagination button:hover,.pagination button.active{border-color:var(--accent);color:var(--accent)}
.pagination button.active{background:var(--surface2)}
@media(max-width:768px){.panel{padding:80px 12px 40px}.panel-header h1{font-size:1.3rem}.stats{gap:8px}.stat-card{min-width:100px;padding:12px}.stat-card .value{font-size:1.2rem}}
</style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="loginGate">
  <div class="login-box">
    <img src="assets/logo.png" alt="Cleber Lima">
    <h2>Acesso Restrito</h2>
    <p>Digite a senha para acessar o painel</p>

</div>

<!-- NAVBAR -->
<header class="navbar scrolled">
  <div class="navbar-inner">

</header>
<div class="mobile-scrim" id="mobileScrim"></div>
<nav class="mobile-menu" id="mobileMenu">

<div class="panel">
  <div class="panel-header">
    <h1>Painel de <span>Controle</span></h1>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-outline" onclick="importJSON()">Importar JSON</button>
      <button class="btn btn-accent" onclick="exportJSON()">Exportar JSON</button>
      <input type="file" id="fileInput" accept=".json" style="display:none">
    </div>
  </div>

  <div class="stats" id="statsBar"></div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Buscar por título, cidade, endereço...">
    <select id="filterTipo">
      <option value="">Todos os tipos</option>
      <option value="judicial">Judicial</option>
      <option value="extrajudicial">Extrajudicial</option>
      <option value="proposta">Proposta</option>
    </select>
    <select id="filterStatus">
      <option value="">Todos os status</option>
      <option value="active">Visíveis</option>
      <option value="hidden">Ocultos</option>
    </select>
    <select id="filterFoto">
      <option value="">Com ou sem foto</option>
      <option value="com">Com foto</option>
      <option value="sem">Sem foto</option>
    </select>
    <button class="btn btn-outline" onclick="resetFilters()">Limpar filtros</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Foto</th>
          <th>Título</th>
          <th>Valor</th>
          <th>Cidade</th>
          <th>Tipo</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>
</div>

<!-- Modal Editar -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>Editar Imóvel</h2>
    <input type="hidden" id="editIdx">
    <label>Título</label>
    <input type="text" id="editTitle">
    <label>Descrição</label>
    <textarea id="editDesc"></textarea>
    <label>Valor (R$)</label>
    <input type="text" id="editPrice">
    <label>Endereço</label>
    <input type="text" id="editEndereco">
    <label>Cidade</label>
    <input type="text" id="editCidade">
    <label>URL da Imagem</label>
    <input type="text" id="editImg">
    <label>Link do Anúncio</label>
    <input type="text" id="editUrl">
    <label>Tipo</label>
    <select id="editTipo">
      <option value="judicial">Judicial</option>
      <option value="extrajudicial">Extrajudicial</option>
      <option value="proposta">Proposta</option>
    </select>
    <label>Status</label>
    <select id="editStatus">
      <option value="active">Visível</option>
      <option value="hidden">Oculto</option>
    </select>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-accent" onclick="saveEdit()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var ALL=[];
var EDITED=false;
var PAGE_SIZE=30;
var CURRENT_PAGE=1;
var PASS_HASH='3c01be085008bd4469c36cf564e83124619fef7054914ce5362d21205fe4b15b';

function sha256(str){
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(function(h){
    return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
  });
}

document.getElementById('loginPass').addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();tryLogin();}
});

function tryLogin(){
  var v=document.getElementById('loginPass').value;
  if(!v)return;
  sha256(v).then(function(h){
    if(h===PASS_HASH){
      sessionStorage.setItem('painel_auth','1');
      document.getElementById('loginGate').style.display='none';
      load();
    } else {
      document.getElementById('loginError').style.display='block';
      document.getElementById('loginPass').value='';
      document.getElementById('loginPass').focus();
    }
  });
}

function load(){
  var local=localStorage.getItem('painel_data');
  if(local){
    try{ALL=JSON.parse(local);render();return}catch(e){}
  }
  document.getElementById('tableBody').innerHTML='<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--muted)">Carregando...</td></tr>';
  fetch('/api/properties?limit=1000').then(function(r){return r.json()}).then(function(j){
    ALL=(j.properties||[]).map(function(p,i){p._idx=i;p._hidden=p.status==='hidden';return p});
    save();render();
  }).catch(function(){
    document.getElementById('tableBody').innerHTML='<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--muted)">Erro ao carregar. Tente novamente.</td></tr>';
  });
}

function save(){localStorage.setItem('painel_data',JSON.stringify(ALL))}

function getFiltered(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var tipo=document.getElementById('filterTipo').value;
  var st=document.getElementById('filterStatus').value;
  var foto=document.getElementById('filterFoto').value;
  return ALL.filter(function(p){
    if(q && ((p.title||'')+(p.cidade||'')+(p.endereco||'')).toLowerCase().indexOf(q)===-1) return false;
    if(tipo && p.leilao_tipo!==tipo) return false;
    if(st==='active' && p._hidden) return false;
    if(st==='hidden' && !p._hidden) return false;
    if(foto==='com' && !p.img_url) return false;
    if(foto==='sem' && p.img_url) return false;
    return true;
  });
}

function render(){
  var filtered=getFiltered();
  var totalPages=Math.ceil(filtered.length/PAGE_SIZE)||1;
  if(CURRENT_PAGE>totalPages) CURRENT_PAGE=totalPages;
  var start=(CURRENT_PAGE-1)*PAGE_SIZE;
  var page=filtered.slice(start,start+PAGE_SIZE);

  // stats
  var total=ALL.length;
  var visiveis=ALL.filter(function(p){return !p._hidden}).length;
  var ocultos=ALL.filter(function(p){return p._hidden}).length;
  var comFoto=ALL.filter(function(p){return p.img_url}).length;
  var media=0;var count=0;
  ALL.forEach(function(p){if(p.lance_minimo_valor>0){media+=p.lance_minimo_valor;count++}});
  media=count?media/count:0;

  document.getElementById('statsBar').innerHTML=
    '<div class="stat-card"><div class="label">Total</div><div class="value">'+total+'</div></div>'+
    '<div class="stat-card"><div class="label">Visíveis</div><div class="value accent">'+visiveis+'</div></div>'+
    '<div class="stat-card"><div class="label">Ocultos</div><div class="value">'+ocultos+'</div></div>'+
    '<div class="stat-card"><div class="label">Com Foto</div><div class="value accent">'+comFoto+'</div></div>'+
    '<div class="stat-card"><div class="label">Valor Médio</div><div class="value">R$ '+formatNum(media)+'</div></div>';

  // table
  var html='';
  if(!page.length){
    html='<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--muted)">Nenhum imóvel encontrado</td></tr>';
  } else {
    page.forEach(function(p){
      var price=p.lance_minimo||'';
      var city=p.cidade&&p.estado?p.cidade+' / '+p.estado:p.cidade||'—';
      var badge=p.leilao_tipo||'judicial';
      var vis=!p._hidden;
      html+='<tr class="'+(vis?'':'hidden-row')+'">'+
        '<td class="cell-img">'+(p.img_url?'<img src="'+p.img_url+'" alt="">':'<div class="no-img">s/f</div>')+'</td>'+
        '<td class="cell-title"><a href="'+(p.url||'#')+'" target="_blank" title="'+(p.title||'')+'">'+(p.title||'—')+'</a></td>'+
        '<td class="cell-price">'+price+'</td>'+
        '<td class="cell-cidade">'+city+'</td>'+
        '<td><span class="cell-tipo '+badge+'">'+badge+'</span></td>'+
        '<td style="color:'+(vis?'var(--success)':'var(--muted)')+'">'+(vis?'Visível':'Oculto')+'</td>'+
        '<td class="cell-actions">'+
          '<button class="icon-edit" onclick="openEdit('+p._idx+')" title="Editar">✏️</button>'+
          '<button class="icon-hide" onclick="toggleHide('+p._idx+')" title="'+(vis?'Ocultar':'Mostrar')+'">'+(vis?'👁️‍🗨️':'👁️')+'</button>'+
          (p.url?'<button class="icon-link" onclick="window.open(\''+p.url+'\',\'_blank\')" title="Ver anúncio">🔗</button>':'')+
        '</td></tr>';
    });
  }
  document.getElementById('tableBody').innerHTML=html;

  // pagination
  var pg='';
  if(totalPages>1){
    pg+='<button onclick="goPage(1)"'+(CURRENT_PAGE===1?' class="active"':'')+'>«</button>';
    var range=2;
    for(var i=Math.max(1,CURRENT_PAGE-range);i<=Math.min(totalPages,CURRENT_PAGE+range);i++){
      pg+='<button onclick="goPage('+i+')"'+(CURRENT_PAGE===i?' class="active"':'')+'>'+i+'</button>';
    }
    pg+='<button onclick="goPage('+totalPages+')"'+(CURRENT_PAGE===totalPages?' class="active"':'')+'>»</button>';
  }
  pg+='<span style="color:var(--muted);font-size:.8rem;padding:8px">'+filtered.length+' imóveis</span>';
  document.getElementById('pagination').innerHTML=pg;
}

function goPage(p){CURRENT_PAGE=p;render();window.scrollTo({top:0,behavior:'smooth'})}

function formatNum(n){return n.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0})}

function openEdit(idx){
  var p=ALL[idx];if(!p)return;
  document.getElementById('editIdx').value=idx;
  document.getElementById('editTitle').value=p.title||'';
  document.getElementById('editDesc').value=p.description||'';
  document.getElementById('editPrice').value=p.lance_minimo||'';
  document.getElementById('editEndereco').value=p.endereco||'';
  document.getElementById('editCidade').value=p.cidade||'';
  document.getElementById('editImg').value=p.img_url||'';
  document.getElementById('editUrl').value=p.url||'';
  document.getElementById('editTipo').value=p.leilao_tipo||'judicial';
  document.getElementById('editStatus').value=p._hidden?'hidden':'active';
  document.getElementById('editModal').classList.add('open');
}

function closeModal(){document.getElementById('editModal').classList.remove('open')}

function saveEdit(){
  var idx=parseInt(document.getElementById('editIdx').value);
  var p=ALL[idx];if(!p)return;
  p.title=document.getElementById('editTitle').value;
  p.description=document.getElementById('editDesc').value;
  p.lance_minimo=document.getElementById('editPrice').value;
  p.endereco=document.getElementById('editEndereco').value;
  p.cidade=document.getElementById('editCidade').value;
  p.img_url=document.getElementById('editImg').value;
  p.url=document.getElementById('editUrl').value;
  p.leilao_tipo=document.getElementById('editTipo').value;
  p.status=document.getElementById('editStatus').value;
  p._hidden=document.getElementById('editStatus').value==='hidden';
  save();EDITED=true;closeModal();render();toast('Imóvel atualizado');
}

function toggleHide(idx){
  var p=ALL[idx];if(!p)return;
  p._hidden=!p._hidden;
  p.status=p._hidden?'hidden':'active';
  save();EDITED=true;render();toast(p._hidden?'Imóvel ocultado':'Imóvel visível');
}

function exportJSON(){
  var data={properties:ALL.map(function(p){
    var o={};Object.keys(p).forEach(function(k){if(k[0]!=='_')o[k]=p[k]});return o;
  }),updatedAt:new Date().toISOString()};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='rjleiloes-data.json';a.click();toast('JSON exportado');
}

function importJSON(){
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change',function(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      ALL=(data.properties||[]).map(function(p,i){p._idx=i;p._hidden=p.status==='hidden';return p});
      save();CURRENT_PAGE=1;render();toast('JSON importado — '+ALL.length+' imóveis');
    }catch(err){toast('Erro ao importar JSON')}
  };reader.readAsText(file);e.target.value='';
});

function resetFilters(){
  document.getElementById('searchInput').value='';
  document.getElementById('filterTipo').value='';
  document.getElementById('filterStatus').value='';
  document.getElementById('filterFoto').value='';
  CURRENT_PAGE=1;render();
}

function toast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2200);
}

document.getElementById('searchInput').addEventListener('input',function(){CURRENT_PAGE=1;render()});
